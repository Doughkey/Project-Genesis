services:
  app:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: "true"
      INGEST_INTERVAL_HOURS: ${INGEST_INTERVAL_HOURS:-3}
      MATANGLAWIN_ADMIN_TOKEN: ${MATANGLAWIN_ADMIN_TOKEN:?Set MATANGLAWIN_ADMIN_TOKEN in deploy/production.env}
    volumes:
      - production-data:/app/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/production.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/production.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app-network
    depends_on:
      app:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  production-data:
    name: matanglawin-production-data
  caddy-data:
  caddy-config:
